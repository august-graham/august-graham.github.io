<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>August Graham's Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>August Graham</h1>
    <nav class="header-links">
      <a href="https://www.instagram.com/augustsgram/" class="header-link" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <img src="images/instagram.png" alt="" width="20" height="20">
      </a>
      <a href="https://www.linkedin.com/in/augustgraham/" class="header-link" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <img src="images/linkedin.png" alt="" width="20" height="28">
      </a>
    </nav>
  </header>

  <main class="content">
    <section class="intro">
      <img
        src="images/portrait.png"
        alt="Portrait"
        class="portrait"
        width="250"
        height="250"
      />
      <div class="about">
        <h2>About</h2>
        <p>
          August Graham is a volumetric display artist & 3D generalist based in Brooklyn building interactive
          and immersive experiences for musicians, brands, and beyond.
        </p>
      </div>
    </section>

    <section class="videos">
      <h2>Work</h2>
      <h3 class="video-title">Live Event Coverage Reel</h3>
      <p class="video-subtitle">Videographer & Editor</p>
      <div class="video-wrapper">
        <iframe src="https://player.vimeo.com/video/1163655913?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" 
        width="400" 
        height="300" 
        frameborder="0" 
        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" title="DocReel2026"></iframe>
      </div>
      <h3 class="video-title">VFX Reel</h3>
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/ikDPdZyYoNc?si=ez9uJKkE20r9N3Dy"
          title="YouTube video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
      <h3 class="video-title">Tentra Pitch</h3>
      <p class="video-subtitle">Director & Editor</p>
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/p2IaERxr3os?si=tRML6Nca21MUb3sQ"
          title="YouTube video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
    </section>
  </main>
</body>
</html>
