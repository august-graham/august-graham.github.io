<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>August Graham</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        #container {
            display: flex;
            flex-direction: column-reverse;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 4px;
            gap: 4px;
            max-width: 1800px;
            margin: 0 auto;
        }
        #points-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            border: 4px solid #ff0000;
            background: #000;
            box-sizing: border-box;
        }
        #buttons-container {
            position: relative;
            width: 100%;
            height: 345px;
            min-height: 345px;
            flex-shrink: 0;
            overflow: hidden;
            border: 4px solid #00ff00;
            background: #000;
            box-sizing: border-box;
        }
        @media (min-width: 769px) {
            #container {
                flex-direction: row;
                padding-left: 40px;
                padding-right: 40px;
            }
            #points-container {
                flex: 1;
                height: 100%;
                min-width: 0;
                width: 50%;
            }
            #buttons-container {
                width: 50%;
                min-width: 50%;
                height: 100%;
            }
        }
        #points-container,
        #buttons-container {
            border-width: 4px;
            border-style: solid;
        }
        body:not(.show-borders) #points-container,
        body:not(.show-borders) #buttons-container {
            border: none !important;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="points-container"></div>
        <div id="buttons-container"></div>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import { initPoints, resize as resizePoints } from './points.js';
        import { initBillboards, resize as resizeBillboards, setContentManager, dismissContent } from './billboards.js';
        import { setupDevPanel, settings } from './gui_settings.js';
        import { ContentManager } from './content-manager.js';

        async function init() {
            const gui = await setupDevPanel();
            const pointsContainer = document.getElementById('points-container');
            const buttonsContainer = document.getElementById('buttons-container');
            
            console.log('Initializing content manager...');
            // Initialize content manager
            const contentManager = new ContentManager(pointsContainer);
            console.log('Content manager created:', contentManager);
            
            // Initialize points (but don't start immediately)
            console.log('Initializing points...');
            initPoints(pointsContainer);
            
            // Initialize billboards with content manager
            console.log('Initializing billboards...');
            initBillboards(buttonsContainer, (text) => {
                // Removed triggerColorChange() call since color functionality was removed
            });
            
            // Set content manager reference in billboards
            console.log('Setting content manager in billboards...');
            setContentManager(contentManager);

            // Add onChange handlers to zoom controls only if GUI exists
            if (gui) {
                const zoomFolder = gui.__folders['Camera Zoom'];
                if (zoomFolder) {
                    zoomFolder.__controllers.forEach(ctrl => {
                        ctrl.onChange(() => {
                            resizePoints();
                            resizeBillboards();
                        });
                    });
                }
            }

            // Only add show-borders class if showBorders is true
            if (settings.showBorders) {
                document.body.classList.add('show-borders');
            }
            
            console.log('Initialization complete');
        }

        init();
    </script>
</body>
</html>
